<section class="services">
  <h1>Our Services</h1>

  <div class="card">
    <h3>CCTV Installation</h3>
    <p>Professional setup</p>

    <button class="btn btn-primary repbtn" (click)="openForm('CCTV Installation')">
      Book Technician
    </button>
  </div>

  <div class="card card2">
    <h3>Repair</h3>
    <p>Fix camera issues</p>

    <button class="btn btn-primary repbtn" (click)="openForm('Repair')">Book Technician</button>
  </div>
</section>

<div class="overlay" *ngIf="isFormOpen" (click)="closeForm()">
  <div class="modal-box" (click)="$event.stopPropagation()">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5>Book {{ selectedService }}</h5>

      <button type="button" class="btn-close" (click)="closeForm()"></button>
    </div>

    <form class="row g-3" (ngSubmit)="submitForm()">
      <!-- Name -->
      <div class="col-md-6">
        <label class="form-label"> Name </label>

        <input type="text" class="form-control" required [(ngModel)]="formData.name" name="name" />
      </div>

      <!-- Email -->
      <div class="col-md-6">
        <label class="form-label"> Email </label>

        <input
          type="email"
          class="form-control"
          required
          [(ngModel)]="formData.email"
          name="email"
        />
      </div>

      <!-- Phone -->
      <div class="col-md-6">
        <label class="form-label"> Phone </label>

        <input
          type="text"
          class="form-control"
          required
          [(ngModel)]="formData.phone"
          name="phone"
        />
      </div>

      <!-- Address -->
      <div class="col-12">
        <label class="form-label"> Address </label>

        <input
          type="text"
          class="form-control"
          placeholder="1234 Main St"
          required
          [(ngModel)]="formData.address"
          name="address"
        />
      </div>

      <!-- City -->
      <div class="col-md-6">
        <label class="form-label"> City </label>

        <input type="text" class="form-control" [(ngModel)]="formData.city" name="city" />
      </div>

      <!-- State -->
      <div class="col-md-4">
        <label class="form-label"> State </label>

        <select class="form-select" [(ngModel)]="formData.state" name="state">
          <option value="">Choose...</option>

          <option>Andhra Pradesh</option>

          <option>Telangana</option>
        </select>
      </div>

      <!-- Zip -->
      <div class="col-md-2">
        <label class="form-label"> Zip </label>

        <input type="text" class="form-control" [(ngModel)]="formData.zip" name="zip" />
      </div>

      <!-- Success Message -->
      <div class="col-12" *ngIf="successMessage">
        <div class="alert alert-success">
          {{ successMessage }}
        </div>
      </div>

      <!-- Error Message -->
      <div class="col-12" *ngIf="errorMessage">
        <div class="alert alert-danger">
          {{ errorMessage }}
        </div>
      </div>

      <!-- Buttons -->
      <div class="col-12 d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-secondary" (click)="closeForm()">Close</button>

        <button type="submit" class="btn btn-primary" [disabled]="isLoading">
          {{ isLoading ? 'Sending...' : 'Submit' }}
        </button>
      </div>
    </form>
  </div>
</div>
